# CoffeePeek production stack for VPS (Docker Compose).
# Usage: cp .env.example .env && edit .env && docker compose up -d

name: coffeepeek

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# A running process is not necessarily listening yet (Wolverine initializes first).
x-app-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/health"]
  interval: 5s
  timeout: 4s
  retries: 6
  start_period: 120s

x-dotnet-common: &dotnet-common
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_HTTP_PORTS: "8080"
  DOTNET_RUNNING_IN_CONTAINER: "true"

x-rabbitmq-env: &rabbitmq-env
  RabbitMqOptions__HostName: rabbitmq
  RabbitMqOptions__Port: "5672"
  RabbitMqOptions__Username: ${RABBITMQ_USER}
  RabbitMqOptions__Password: ${RABBITMQ_PASSWORD}
  RabbitMqOptions__VirtualHost: ${RABBITMQ_VHOST:-/}

x-redis-env: &redis-env
  RedisOptions__Host: redis
  RedisOptions__Port: "6379"
  RedisOptions__Password: ${REDIS_PASSWORD}

x-jwt-env: &jwt-env
  JWTOptions__SecretKey: ${JWT_SECRET_KEY}
  JWTOptions__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
  JWTOptions__RefreshTokenLifetimeDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
  JWTOptions__Audience: CoffeePeek.API
  JWTOptions__Issuer: CoffeePeek.WEB

x-gateway-auth-env: &gateway-auth-env
      GatewayAuth__SecretKey: ${GATEWAY_AUTH_SECRET:?GATEWAY_AUTH_SECRET is required}

x-media-public-env: &media-public-env
  MediaPublicUrlOptions__PublicEndpoint: ${MEDIA_PUBLIC_URL:-}
  MediaPublicUrlOptions__ImageProxyEndpoint: ${IMAGE_PROXY_URL:-}
  MediaPublicUrlOptions__ShopBucketName: coffeepeek.shops
  MediaPublicUrlOptions__AvatarBucketName: coffeepeek.avatars

# Aspire resource names (coffeepeek-*) default to port 80. Compose services listen on 8080
# under short names (media, shops, …). HttpClients use AddServiceDiscovery() and resolve
# via this Services:* map — without it check-ins with photos call coffeepeek-mediaservice:80.
x-aspire-service-discovery: &aspire-service-discovery
  services__coffeepeek-accountservice__http__0: http://account:8080
  services__coffeepeek-shopsservice__http__0: http://shops:8080
  services__coffeepeek-moderationservice__http__0: http://moderation:8080
  services__coffeepeek-mediaservice__http__0: http://media:8080

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  rabbitmq:
    image: public.ecr.aws/docker/library/rabbitmq:3.13-management-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    networks: [default, checkin-render]
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  minio-init:
    image: coffeepeek-minio-mc:2025-08-13
    pull_policy: build
    build:
      context: ./minio
      dockerfile: mc.Dockerfile
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "/provision/provision.sh"]
    volumes:
      - ./minio:/provision:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CHECKIN_READ_USER: ${MINIO_CHECKIN_READ_USER:?set a dedicated MinIO reader}
      MINIO_CHECKIN_READ_PASSWORD: ${MINIO_CHECKIN_READ_PASSWORD:?set the dedicated reader password}
      MINIO_CHECKIN_VARIANT_USER: ${MINIO_CHECKIN_VARIANT_USER:?set a dedicated variant writer}
      MINIO_CHECKIN_VARIANT_PASSWORD: ${MINIO_CHECKIN_VARIANT_PASSWORD:?set the variant writer password}
      MINIO_CHECKIN_VARIANT_READ_USER: ${MINIO_CHECKIN_VARIANT_READ_USER:?set a dedicated variant reader}
      MINIO_CHECKIN_VARIANT_READ_PASSWORD: ${MINIO_CHECKIN_VARIANT_READ_PASSWORD:?set the variant reader password}

  # Resized image variants in front of MinIO. Reachable only on the compose network through Caddy
  # ({MEDIA_DOMAIN}/img/*). No MinIO credentials: it reads the anonymous-download buckets over plain HTTP.
  # No IMGPROXY_KEY/IMGPROXY_SALT, so URLs are unsigned and use the "_" signature placeholder.
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - minio
    environment:
      IMGPROXY_BASE_URL: http://minio:9000/
      IMGPROXY_ALLOWED_SOURCES: http://minio:9000/
      IMGPROXY_ONLY_PRESETS: "true"
      # Preset names must match CoffeePeek.Shared.Kernel/ImageVariantPresets.cs.
      # Presets-only mode blocks arbitrary-size requests (CPU/memory abuse); rs:fit never enlarges
      # small originals because enlarge defaults to false.
      IMGPROXY_PRESETS: thumb=rs:fill:240:180,card=rs:fill:600:450,detail=rs:fit:1200:1200,full=rs:fit:1920:1920
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_TTL: "31536000"
    deploy:
      resources:
        limits:
          memory: 512M

  # Private signed renderer: no published ports and no public proxy network.
  checkin-renderer:
    image: ghcr.io/imgproxy/imgproxy:v4.0.18
    restart: unless-stopped
    # Renderer error logs can include signed source URLs; use bounded Media metrics/logs instead.
    logging:
      driver: none
    networks: [checkin-render]
    env_file: ./imgproxy/checkin-renderer.conf
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_CHECKIN_READ_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_CHECKIN_READ_PASSWORD}
      IMGPROXY_KEY: ${CHECKIN_RENDERER_KEY:?set the renderer signing key}
      IMGPROXY_SALT: ${CHECKIN_RENDERER_SALT:?set the renderer signing salt}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0

  account:
    networks:
      default:
      proxy:
        aliases: [account-proxy]
    healthcheck: *app-healthcheck
    image: ${DOCKER_IMAGE_PREFIX}/coffeepeek.accountservice:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: CoffeePeek.AccountService/AccountService.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: [*dotnet-common, *rabbitmq-env, *redis-env, *jwt-env, *media-public-env, *gateway-auth-env, *aspire-service-discovery]
      PostgresCpOptions__ConnectionString: Host=postgres;Port=5432;Database=cpaccountdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SslMode=Disable;GSS Encryption Mode=Disable
      PublicAddresses__Enabled: "${ACCOUNT_PUBLIC_ADDRESSES_ENABLED:-false}"
      ForwardedHeaders__KnownProxies__0: ${PROXY_NETWORK_PREFIX:-172.30.42}.3
      MinIOOptions__Endpoint: http://minio:9000
      MinIOOptions__AccessKey: ${MINIO_ROOT_USER}
      MinIOOptions__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinIOOptions__BucketName: coffeepeek.avatars
      OAuthGoogleOptions__ClientId: ${GOOGLE_CLIENT_ID:-770099870632-5eeebr3eqdrma4reson9mv02j4lro583.apps.googleusercontent.com}
      OAuthGoogleOptions__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      OAuthAppleOptions__ClientId: ${APPLE_CLIENT_ID:-com.coffeepeek}
      OAuthAppleOptions__ServiceId: ${APPLE_WEB_CLIENT_ID:-}
      OAuthAppleOptions__TeamId: ${APPLE_TEAM_ID:-}
      OAuthAppleOptions__KeyId: ${APPLE_KEY_ID:-}
      OAuthAppleOptions__PrivateKeyPem: ${APPLE_PRIVATE_KEY_PEM:-}
      OAuthAppleOptions__RedirectUri: ${APPLE_REDIRECT_URI:-}
      ResendClientOptions__ApiToken: ${RESEND_API_TOKEN}
      AccountDeletionOptions__TokenPepper: ${ACCOUNT_DELETION_TOKEN_PEPPER:-${JWT_SECRET_KEY}}
      AccountDeletionOptions__TokenLifetimeHours: ${ACCOUNT_DELETION_TOKEN_LIFETIME_HOURS:-24}
      AccountDeletionOptions__ResendCooldownMinutes: ${ACCOUNT_DELETION_RESEND_COOLDOWN_MINUTES:-5}
      AccountDeletionOptions__MaxEmailsPerHour: ${ACCOUNT_DELETION_MAX_EMAILS_PER_HOUR:-3}
      WebClientUrl: ${WEB_CLIENT_URL}
      AdminStatsOptions__ShopsServiceUrl: http://shops:8080
      AdminStatsOptions__ModerationServiceUrl: http://moderation:8080
      Sentry__Dsn: ${SENTRY_DSN_ACCOUNT:-}
    mem_limit: 1024m
    memswap_limit: 1024m

  shops:
    healthcheck: *app-healthcheck
    image: ${DOCKER_IMAGE_PREFIX}/coffeepeek.shopsservice:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: CoffeePeek.ShopsService/ShopsService.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # The host systemd collector reaches private APIs only through loopback.
    ports:
      - "127.0.0.1:${COFFEE_IMPORT_SHOPS_PORT:-5243}:8080"
    volumes:
      # ASP.NET's standard Production JSON provider binds the source/brand GUID map.
      # Keep the reviewed mapping outside the checkout, which CI rsync replaces.
      - type: bind
        source: ${COFFEE_IMPORT_MAPPING_FILE:-./coffee-import/disabled-mapping.json}
        target: /app/appsettings.Production.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      media:
        condition: service_healthy
    environment:
      CheckInPhotoDeliveryOptions__ServeVariants: ${CHECKIN_VARIANTS_SERVE_ENABLED:-false}
      CheckInPhotoDeliveryOptions__AdvertiseVariants: ${CHECKIN_VARIANTS_ADVERTISE_ENABLED:-false}
      CheckInPhotoDeliveryOptions__CachePublicVariants: ${CHECKIN_VARIANTS_CACHE_ENABLED:-false}
      <<: [*dotnet-common, *rabbitmq-env, *redis-env, *media-public-env, *gateway-auth-env, *aspire-service-discovery]
      PostgresCpOptions__ConnectionString: Host=postgres;Port=5432;Database=cpshopsdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SslMode=Disable;GSS Encryption Mode=Disable
      PublicAddresses__Enabled: "${SHOPS_PUBLIC_ADDRESSES_ENABLED:-false}"
      CoffeeImportAuthOptions__Token: ${COFFEE_IMPORT_TOKEN:-}
      OpenAiOptions__ApiKey: ${OPENAI_API_KEY:-}
      OpenAiOptions__Model: ${OPENAI_MODEL:-gpt-4.1-mini}
      OpenAiOptions__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OpenAiOptions__ProxyUrl: ${OPENAI_PROXY_URL:-}
      OpenAiOptions__TimeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:-90}
      Sentry__Dsn: ${SENTRY_DSN_SHOPS:-}
    mem_limit: 1024m
    memswap_limit: 1024m

  moderation:
    healthcheck: *app-healthcheck
    image: ${DOCKER_IMAGE_PREFIX}/coffeepeek.moderationservice:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: CoffeePeek.ModerationService/ModerationService.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: [*dotnet-common, *rabbitmq-env, *media-public-env, *gateway-auth-env, *aspire-service-discovery]
      PostgresCpOptions__ConnectionString: Host=postgres;Port=5432;Database=cpmoderationdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SslMode=Disable;GSS Encryption Mode=Disable
      MinIOOptions__Endpoint: http://minio:9000
      MinIOOptions__AccessKey: ${MINIO_ROOT_USER}
      MinIOOptions__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinIOOptions__BucketName: coffeepeek.shops
      YandexApiOptions__ApiKey: ${YANDEX_GEOCODER_API_KEY:-}
      GooglePlaces__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
      TelegramModeration__BotToken: ${TELEGRAM_MODERATION_BOT_TOKEN:-}
      TelegramModeration__ChatId: ${TELEGRAM_MODERATION_CHAT_ID:-}
      TelegramModeration__RelayUrl: ${TELEGRAM_MODERATION_RELAY_URL:-}
      TelegramModeration__ModeratorUserId: ${TELEGRAM_MODERATION_MODERATOR_USER_ID:-f2d527fc-8135-42c5-a76b-da1f3e82bda0}
      TelegramModeration__ApiBaseUrl: https://${DOMAIN}
      TelegramModeration__AdminBaseUrl: https://platform-admin.coffeepeek.by
      Sentry__Dsn: ${SENTRY_DSN_MODERATION:-}
    mem_limit: 1536m
    memswap_limit: 1536m

  media:
    networks: [default, checkin-render]
    healthcheck: *app-healthcheck
    image: ${DOCKER_IMAGE_PREFIX}/coffeepeek.mediaservice:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: CoffeePeek.MediaService/MediaService.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${COFFEE_IMPORT_MEDIA_PORT:-5025}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PhotoVariantOptions__ReadEnabled: ${CHECKIN_VARIANTS_READ_ENABLED:-false}
      PhotoVariantOptions__ReadAccessKey: ${MINIO_CHECKIN_VARIANT_READ_USER}
      PhotoVariantOptions__ReadSecretKey: ${MINIO_CHECKIN_VARIANT_READ_PASSWORD}
      PhotoVariantOptions__Enabled: ${CHECKIN_VARIANTS_ENABLED:-false}
      PhotoVariantOptions__CleanupEnabled: ${CHECKIN_VARIANTS_CLEANUP_ENABLED:-false}
      PhotoVariantOptions__CleanupDryRun: ${CHECKIN_VARIANTS_CLEANUP_DRY_RUN:-true}
      PhotoVariantOptions__RendererEndpoint: http://checkin-renderer:8080
      PhotoVariantOptions__SigningKey: ${CHECKIN_RENDERER_KEY}
      PhotoVariantOptions__SigningSalt: ${CHECKIN_RENDERER_SALT}
      PhotoVariantOptions__AccessKey: ${MINIO_CHECKIN_VARIANT_USER}
      PhotoVariantOptions__SecretKey: ${MINIO_CHECKIN_VARIANT_PASSWORD}
      <<: [*dotnet-common, *rabbitmq-env, *media-public-env, *gateway-auth-env]
      PostgresCpOptions__ConnectionString: Host=postgres;Port=5432;Database=cpmediadb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SslMode=Disable;GSS Encryption Mode=Disable
      CoffeeImportAuthOptions__Token: ${COFFEE_IMPORT_TOKEN:-}
      MinIOOptions__Endpoint: http://minio:9000
      MinIOOptions__AccessKey: ${MINIO_ROOT_USER}
      MinIOOptions__SecretKey: ${MINIO_ROOT_PASSWORD}
      CheckInPhotoReadOptions__AccessKey: ${MINIO_CHECKIN_READ_USER}
      CheckInPhotoReadOptions__SecretKey: ${MINIO_CHECKIN_READ_PASSWORD}
      MinIOOptions__ShopBucketName: coffeepeek.shops
      MinIOOptions__UserBucketName: coffeepeek.avatars
      Sentry__Dsn: ${SENTRY_DSN_MEDIA:-}
    mem_limit: 512m
    memswap_limit: 512m

  gateway:
    networks:
      default:
      proxy:
        ipv4_address: ${PROXY_NETWORK_PREFIX:-172.30.42}.3
        aliases: [gateway-proxy]
    healthcheck: *app-healthcheck
    image: ${DOCKER_IMAGE_PREFIX}/gateway:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: CoffeePeek.Gateway/Gateway.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      account:
        condition: service_healthy
      shops:
        condition: service_healthy
      moderation:
        condition: service_healthy
      media:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: [*dotnet-common, *jwt-env, *redis-env, *gateway-auth-env]
      ForwardedHeaders__KnownProxies__0: ${PROXY_NETWORK_PREFIX:-172.30.42}.2
      ReverseProxy__Clusters__account-cluster__Destinations__destination1__Address: http://account-proxy:8080
      ReverseProxy__Clusters__shops-cluster__Destinations__destination1__Address: http://shops:8080
      ReverseProxy__Clusters__moderation-cluster__Destinations__destination1__Address: http://moderation:8080
      ReverseProxy__Clusters__media-cluster__Destinations__destination1__Address: http://media:8080
      AppReleaseAutomation__Token: ${APP_RELEASE_AUTOMATION_TOKEN:-}
      AppReleaseAutomation__ActorUserId: 52a6ea58-11c7-4a9f-b7d9-77bf842169d5
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      Sentry__Dsn: ${SENTRY_DSN_GATEWAY:-}
    mem_limit: 1024m
    memswap_limit: 1024m

  caddy:
    networks:
      default:
      proxy:
        ipv4_address: ${PROXY_NETWORK_PREFIX:-172.30.42}.2
    profiles: [https]
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      gateway:
        condition: service_healthy
      imgproxy:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/coffeepeek-downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}

# Stable proxy IPs without trusting the default network or other application containers.
networks:
  checkin-render:
    internal: true
  default:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_NETWORK_PREFIX:-172.30.42}.0/24
          ip_range: ${PROXY_NETWORK_PREFIX:-172.30.42}.128/25

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  caddy_data:
  caddy_config:
