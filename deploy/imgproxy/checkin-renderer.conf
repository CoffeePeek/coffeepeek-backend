# Recipe v1. Keep these presets immutable; recipe changes need new names and a Media version bump.
IMGPROXY_USE_S3=true
IMGPROXY_S3_ENDPOINT=http://minio:9000
IMGPROXY_S3_REGION=us-east-1
IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE=true
IMGPROXY_S3_ALLOWED_BUCKETS=coffeepeek.checkins
IMGPROXY_ALLOWED_SOURCES=s3://coffeepeek.checkins/
IMGPROXY_ONLY_PRESETS=true
IMGPROXY_PRESETS=v1_thumb_webp=rs:fit:320:320:0/f:webp/q:80/a:0,v1_thumb_jpeg=rs:fit:320:320:0/f:jpg/q:82/a:0,v1_thumb_png=rs:fit:320:320:0/f:png/a:0,v1_feed_webp=rs:fit:960:960:0/f:webp/q:80/a:0,v1_feed_jpeg=rs:fit:960:960:0/f:jpg/q:82/a:0,v1_feed_png=rs:fit:960:960:0/f:png/a:0,v1_detail_webp=rs:fit:1600:1600:0/f:webp/q:80/a:0,v1_detail_jpeg=rs:fit:1600:1600:0/f:jpg/q:82/a:0,v1_detail_png=rs:fit:1600:1600:0/f:png/a:0
IMGPROXY_MAX_SRC_FILE_SIZE=33554432
IMGPROXY_MAX_SRC_RESOLUTION=40
IMGPROXY_MAX_ANIMATION_FRAMES=1
IMGPROXY_MAX_ANIMATION_FRAME_RESOLUTION=40
IMGPROXY_MAX_RESULT_DIMENSION=1600
IMGPROXY_TIMEOUT=20
IMGPROXY_DOWNLOAD_TIMEOUT=10
IMGPROXY_MAX_REDIRECTS=0
IMGPROXY_WORKERS=1
IMGPROXY_REQUESTS_QUEUE_SIZE=2
IMGPROXY_STRIP_METADATA=true
IMGPROXY_KEEP_COPYRIGHT=false
IMGPROXY_STRIP_COLOR_PROFILE=true
IMGPROXY_AUTO_ROTATE=true
# Access logs include signed private source URLs; retain errors only, never debug output.
IMGPROXY_LOG_LEVEL=error
AWS_EC2_METADATA_DISABLED=true
