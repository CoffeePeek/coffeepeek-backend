x-contract-rules:
  public-identities: Объекты идентифицируются slug/public address; агрегатные GUID только в админке. Тип группы
    различает одинаковые slug.
  personalization: JWT необязателен для чтения; персональные фильтры требуют его. Ответы с личными полями не разделяются
    между пользователями.
  facet-codes: Коды из активных справочников проверяются по группе. Деактивация не удаляет назначения. Новый код
    не изменяет алгоритм распознавания парсера.
  empty-selections: Отсутствующая группа и [] не ограничивают поиск. Неизвестные значения не игнорируются. В одиночных
    фильтрах отсутствие означает отсутствие ограничения.
  classification-evidence: Нормализация допускается только из подтверждённого источника или ручной правки. Нет вывода
    regular из отсутствия слова декаф, single-origin из одной страны, назначения обжарки из помола, сопоставления
    числовых шкал обжарки между сайтами.
  availability: Публичные товары только Published. Импорт нового товара создаёт Draft, повторный обновляет Published
    без повторного подтверждения. Archived не возвращается в выдачу импортом. Неисправный источник сохраняет старые
    данные и checkedAtUtc; InStock не гарантирует свежесть или складской остаток. Клиент показывает время проверки.
  normalization-lifecycle: Публичные badges/фасеты строятся по нормализованной классификации. Подтверждённые незащищённые
    поля обновляются импортом. Отсутствующее значение не очищает прежнее; предупреждения и исходный текст остаются
    для модерации.
  price: Нет конвертации валют и сравнения цены разных фасовок. price_asc/price_desc требуют currency+weightGrams.
    Ценовой ключ — самая дешёвая подходящая фасовка указанного веса, а не самое дешёвое предложение продукта вообще.
  menu-price: В coffee-shops/search filters.menu.minPrice/maxPrice относятся к напиткам. Приготовление и цена
    должны совпасть у одной позиции меню.
  filter-scopes: 'География, расписание, меню, посещения и избранное — в coffee-shops/search;
    характеристики кофе и price/newest сортировки — в coffees/search. Обжарщики:
    полный список GET /api/roasters с необязательными тегами.'
  negative-filters: Для неяркой кислотности выбираются low+balanced; unknown не включается.
  pagination: В поиске кофе/кофеен фильтры и сортировка выполняются до пагинации. Изменение фильтра сбрасывает page=1.
    Список обжарщиков возвращается целиком без пагинации.
  validation: 'Неизвестные поля и несовместимые фильтры: 400 INVALID_FILTER с errors по пути поля. Непустой q для
    relevance. Price sort без currency/weight: 400. Персональный фильтр без JWT: 401. Несвежая admin version: 409
    VERSION_CONFLICT. Невалидный/неопубликованный slug карточки: 404.'
paths:
  /api/v1/coffee-shops/search:
    post:
      operationId: searchCoffeeShopsV1
      summary: Отдельный поиск кофеен со своей фильтрацией
      description: Полный собственный набор фильтров кофеен, независимый от общего поиска. Существующий GET /api/CoffeeShops
        сохраняет свой текущий контракт.
      tags:
      - Discovery
      security:
      - {}
      - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ в стандартном Response<T> проекта.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  isSuccess:
                    type: boolean
                    const: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CoffeeShopPage'
                required:
                - isSuccess
                - message
                - data
              example:
                isSuccess: true
                message: Operation successful
                data:
                  items:
                  - address:
                      slug: sample-shop
                      canonicalPath: /coffee-shops/sample-shop
                      revision: 1
                    name: Пример кофейни
                    city:
                      slug: minsk
                      canonicalPath: /cities/minsk
                      revision: 1
                    addressLine: Пример улицы, 1
                    coverPhoto: null
                    rating: 4.3
                    checkInCount: 12
                    isOpen: true
                    isVisited: null
                    isFavorite: null
                    distanceMeters: null
                    tags: []
                    matchingMenuItems:
                    - drinkSlug: filter-coffee
                      name: Фильтр-кофе
                      brewMethod: filter
                      price: 8
                      currency: BYN
                      checkedAtUtc: '2026-10-05T08:00:00Z'
                  totalItems: 1
                  totalPages: 1
                  currentPage: 1
                  pageSize: 20
        '400':
          description: Некорректный фильтр, несовместимые параметры или неизвестный/неактивный код.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Необходим JWT для административной операции или персонального фильтра.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис данных временно недоступен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoffeeShopSearchRequest'
            example:
              filters:
                city: minsk
                isOpen: true
                brewMethods:
                - filter
                menu:
                  brew:
                  - filter
                  currency: BYN
                  maxPrice: 10
              sort: name_asc
              page: 1
              pageSize: 20
