    SharedBrewMethod:
      type: string
      enum:
      - espresso
      - filter
      description: 'Общий v1-фильтр приготовления: напитки на основе эспрессо или фильтр. Для обжарщиков проверяются
        подтверждённые brewPurpose/defaultBrewPurposes кофе; omni подходит обоим. Для кофеен используются подтверждённые
        методы или позиции меню с соответствующей CoffeeDrinkCategory. Точные способы и характеристики доступны
        в отдельных каталогах.'
    MenuFilters:
      type: object
      additionalProperties: false
      properties:
        brew:
          type: array
          items:
            $ref: '#/components/schemas/SharedBrewMethod'
          uniqueItems: true
          maxItems: 2
        currency:
          type: string
          enum:
          - BYN
          - RUB
        minPrice:
          type: number
          minimum: 0
        maxPrice:
          type: number
          minimum: 0
      description: Поиск по Present-позициям меню. При цене currency обязательна; цена, brew и объём должны совпасть
        у одной позиции. Без цены brew может опираться на подтверждённый метод кофейни. Отсутствующая цена не проходит
        числовой фильтр.
      allOf:
      - if:
          anyOf:
          - required:
            - minPrice
          - required:
            - maxPrice
        then:
          required:
          - currency
    MatchedMenuItem:
      type: object
      additionalProperties: false
      properties:
        drinkSlug:
          $ref: '#/components/schemas/PublicSlug'
        name:
          type: string
        brewMethod:
          $ref: '#/components/schemas/SharedBrewMethod'
        price:
          anyOf:
          - type: number
            exclusiveMinimum: 0
          - type: 'null'
        currency:
          type: string
          enum:
          - BYN
          - RUB
        checkedAtUtc:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - drinkSlug
      - name
      - brewMethod
      - price
      - currency
      - checkedAtUtc
      description: Подходящая позиция меню объясняет совпадение по цене/приготовлению. При ценовом фильтре price
        не null. Время проверки относится к меню. Это цена напитка, не зерна.
    CoffeeShopSearchRequest:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          maxLength: 100
          default: ''
          description: Поиск по названию и адресу. Trim, схлопывание пробелов, регистронезависимый поиск с ё=е.
            При relevance точное название выше префикса, затем совпадения слова и подстроки названия,
            затем совпадение только адреса. Нечёткий поиск по опечаткам не входит в v1.
        filters:
          $ref: '#/components/schemas/ShopFilters'
        sort:
          type: string
          enum:
          - recommended
          - relevance
          - name_asc
          - distance_asc
          - rating_desc
        page:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      description: 'Без явной сортировки при непустом q применяется relevance, иначе recommended.
        recommended учитывает сглаженный рейтинг уникальных авторов, расстояние при origin, заполненность
        карточки и предпочтения текущего пользователя из JWT; гостю доступны общие рекомендации.
        Явная сортировка имеет приоритет. distance_asc требует origin; relevance требует непустой q.
        Ранжирование выполняется до пагинации. При равенстве — name, затем slug. Поля ответа не меняются.'
      allOf:
      - if:
          required:
          - sort
          properties:
            sort:
              const: relevance
        then:
          required:
          - q
          properties:
            q:
              pattern: \S
      - if:
          required:
          - sort
          properties:
            sort:
              const: distance_asc
        then:
          required:
          - filters
          properties:
            filters:
              required:
              - origin
