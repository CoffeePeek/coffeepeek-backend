  /api/v1/favorites:
    get:
      operationId: getDiscoveryFavorites
      summary: Избранные кофейни, обжарщики и напитки текущего пользователя
      description: Сохранённые избранные объекты также видны в публичном профиле пользователя.
      security: &id001
      - bearerAuth: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiscoveryFavoriteItem'
                required:
                - data
        '401':
          description: Требуется авторизация
  /api/v1/profiles/{authorSlug}/favorites:
    get:
      operationId: getPublicProfileFavorites
      summary: Любимые кофейни, обжарщики и напитки публичного профиля
      description: Возвращает все сохранённые избранные объекты доступного профиля. Скрытые кофейни и неактивные напитки исключаются.
      security: []
      parameters:
      - name: authorSlug
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PublicSlug'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiscoveryFavoriteItem'
                required:
                - data
        '404':
          description: Профиль не найден или недоступен
  /api/v1/favorites/{kind}/{slug}:
    put:
      operationId: addDiscoveryFavorite
      summary: Добавить в избранное
      security: *id001
      parameters: &id002
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - coffee_shop
          - roaster
          - drink
      - name: slug
        in: path
        required: true
        description: Публичный slug кофейни/обжарщика либо стабильный slug напитка из каталога. Slug напитка может содержать подчёркивание.
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:[_-][a-z0-9]+)*$
          minLength: 1
          maxLength: 100
      responses:
        '204':
          description: Изменение сохранено; повторный запрос идемпотентен
        '401':
          description: Требуется авторизация
        '404':
          description: Публичный объект не найден
    delete:
      operationId: removeDiscoveryFavorite
      summary: Удалить из избранного
      security: *id001
      parameters: *id002
      responses:
        '204':
          description: Изменение сохранено; повторный запрос идемпотентен
        '401':
          description: Требуется авторизация
        '404':
          description: Публичный объект не найден
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FilterCode:
      type: string
      pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
      maxLength: 100
      description: 'Стабильный код из активного справочника нужной группы. Неизвестный или неактивный код: 400.
        Код не меняется при переименовании.'
    PublicSlug:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      minLength: 1
      maxLength: 100
      not:
        anyOf:
        - enum:
          - api
          - admin
          - new
          - edit
          - create
          - delete
          - search
          - me
          - by-slug
          - login
          - logout
          - register
          - settings
          - health
          - swagger
          - scalar
          - 'null'
          - undefined
          - public-addresses
          - history
          - backfill
          - initialize
          - rename
          - batch
          - visibility
          - owner
          - photos
          - menu
        - pattern: ^[a-f0-9]{32}$
        - pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
      description: Публичный slug по существующим правилам проекта; допускается начало с цифры. Зарезервированные
        имена и GUID недопустимы.
    PublicAddress:
      type: object
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/PublicSlug'
        canonicalPath:
          type: string
          pattern: ^/
        revision:
          type: integer
          minimum: 1
        isAlias:
          type: boolean
          default: false
      required:
      - slug
      - canonicalPath
      - revision
    Photo:
      type: object
      additionalProperties: false
      properties:
        fullUrl:
          type: string
          format: uri
        urls:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              thumbnail:
                type: string
                format: uri
              card:
                type: string
                format: uri
              detail:
                type: string
                format: uri
              fullscreen:
                type: string
                format: uri
            required:
            - thumbnail
            - card
            - detail
            - fullscreen
          - type: 'null'
      required:
      - fullUrl
      - urls
    Country:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
        nameRu:
          type: string
        nameEn:
          type: string
      required:
      - code
      - nameRu
      - nameEn
    PublicTag:
      type: object
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/PublicSlug'
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        sortOrder:
          type: integer
      required:
      - slug
      - name
      - description
      - sortOrder
    Geo:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - latitude
      - longitude
    Error:
      type: object
      additionalProperties: false
      properties:
        isSuccess:
          type: boolean
          const: false
        message:
          type: string
        data:
          type: 'null'
        errorCode:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        statusCode:
          type: integer
          minimum: 400
          maximum: 599
      required:
      - isSuccess
      - message
      - data
      - errorCode
    CoffeeFilters:
      type: object
      additionalProperties: false
      properties:
        roasters:
          type: array
          items:
            $ref: '#/components/schemas/PublicSlug'
          uniqueItems: true
          maxItems: 30
          description: Slug обжарщиков; OR.
        countries:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
          uniqueItems: true
          maxItems: 30
          description: ISO-коды из справочника стран; OR.
        productKind:
          type: string
          enum:
          - roasted_beans
          - green_beans
        productForm:
          type: string
          enum:
          - whole_beans
          - ground_only
        brew:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: Назначение обжарки, группа brew; OR. filter/espresso также подходят явно подтверждённой omni.
            Проверяется у подходящего варианта.
        caffeine:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: 'Группа caffeine: regular, decaf, lowcaf; OR.'
        roast:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: 'Группа roast: light, medium, dark; OR.'
        acidity:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: 'Группа acidity: low, balanced, bright; OR. Неяркая кислотность — low или balanced; неизвестное
            значение не подходит.'
        processing:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: 'Группа processing: washed, natural, honey, wet-hulled; OR.'
        fermentation:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: 'Группа fermentation: anaerobic, semi-anaerobic, experimental; OR.'
        taste:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: 'Группа taste: chocolate, nut, caramel, berry, citrus, tropical, floral, spicy; OR.'
        composition:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: 'Группа composition: single-origin, blend; OR.'
        weightGrams:
          type: integer
          minimum: 1
          maximum: 100000
        currency:
          type: string
          enum:
          - BYN
          - RUB
        minPrice:
          type: number
          minimum: 0
        maxPrice:
          type: number
          minimum: 0
        availabilityScope:
          type: string
          enum:
          - online
          - in_store
        availableOnly:
          type: boolean
          default: true
      description: AND между группами, OR внутри одной группы. Признаки относятся к одному продукту; brew, вес,
        валюта, цена, область и наличие должны совпасть у одного его варианта. Отсутствующее значение не удовлетворяет
        выбранному фильтру. При заданной цене currency обязательна; minPrice <= maxPrice. availableOnly=true означает
        наличие хотя бы одного подходящего InStock-варианта.
      allOf:
      - if:
          anyOf:
          - required:
            - minPrice
          - required:
            - maxPrice
        then:
          required:
          - currency
    ShopFilters:
      type: object
      additionalProperties: false
      properties:
        city:
          $ref: '#/components/schemas/PublicSlug'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/PublicSlug'
          uniqueItems: true
          maxItems: 30
          description: Активные shop-tag slug; AND.
        roasters:
          type: array
          items:
            $ref: '#/components/schemas/PublicSlug'
          uniqueItems: true
          maxItems: 30
          description: Кофейни, связанные с одним из выбранных обжарщиков. Связь не доказывает наличие конкретного
            кофе.
        isOpen:
          type: boolean
        minRating:
          type: number
          minimum: 0
          maximum: 5
        isNew:
          type: boolean
        equipments:
          type: array
          items:
            $ref: '#/components/schemas/PublicSlug'
          uniqueItems: true
          maxItems: 30
        beans:
          type: array
          items:
            $ref: '#/components/schemas/PublicSlug'
          uniqueItems: true
          maxItems: 30
        brewMethods:
          type: array
          items:
            $ref: '#/components/schemas/PublicSlug'
          uniqueItems: true
          maxItems: 30
          description: Методы из существующего справочника кофеен; OR.
        priceRange:
          type: string
          enum:
          - cheap
          - moderate
          - expensive
          description: Общий ценовой уровень кофейни, не цена пачки кофе.
        type:
          type: string
          enum:
          - specialty
          - coffee-bar
          - cafe
        visitedOnly:
          type: boolean
          default: false
        favoritesOnly:
          type: boolean
          default: false
        origin:
          $ref: '#/components/schemas/Geo'
        radiusKm:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        menu:
          $ref: '#/components/schemas/MenuFilters'
      description: Фильтры применяются только к группе кофеен. radiusKm требует origin. visitedOnly/favoritesOnly=true
        требуют JWT; иначе 401. Личность пользователя берётся из JWT.
      allOf:
      - if:
          required:
          - radiusKm
        then:
          required:
          - origin
    ShopSection:
      type: object
      additionalProperties: false
      properties:
        filters:
          $ref: '#/components/schemas/ShopFilters'
        sort:
          type: string
          enum:
          - relevance
          - name_asc
          - distance_asc
          - rating_desc
        page:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      description: 'При q: relevance; без q: distance_asc при origin, иначе name_asc. distance_asc требует origin.
        relevance требует непустой q. При равенстве — name, затем slug.'
      allOf:
      - if:
          required:
          - sort
          properties:
            sort:
              const: distance_asc
        then:
          required:
          - filters
          properties:
            filters:
              required:
              - origin
    CoffeeSearchRequest:
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          maxLength: 100
          default: ''
          description: Trim, схлопывание пробелов, регистронезависимый поиск с ё=е. Точное название выше префикса,
            затем совпадения слова и подстроки. Нечёткий поиск по опечаткам не входит в v1.
        filters:
          $ref: '#/components/schemas/CoffeeFilters'
        sort:
          type: string
          enum:
          - relevance
          - name_asc
          - price_asc
          - price_desc
          - newest
        page:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      description: 'q ищет название кофе и обжарщика: название кофе имеет больший вес. По умолчанию relevance при
        q, иначе name_asc. relevance требует q. Для price_asc/price_desc обязательны currency и weightGrams. Ключ
        цены — MIN(price) среди вариантов, подходящих ВСЕМ фильтрам; он сортируется в выбранном направлении. newest
        использует createdAtUtc, а не дату суточного импорта. При сортировке по имени и равенстве основного критерия
        названия с буквами/цифрами в начале идут перед названиями со спецсимволами (включая _), внутри групп — name,
        затем slug. Только Published.'
      allOf:
      - if:
          required:
          - sort
          properties:
            sort:
              enum:
              - price_asc
              - price_desc
        then:
          required:
          - filters
          properties:
            filters:
              required:
              - currency
              - weightGrams
      - if:
          required:
          - sort
          properties:
            sort:
              const: relevance
        then:
          required:
          - q
          properties:
            q:
              pattern: \S
    CoffeeClassification:
      type: object
      additionalProperties: false
      properties:
        defaultBrewPurposes:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: Группа brew; используется, когда вариант не имеет собственного подтверждённого назначения.
        caffeine:
          anyOf:
          - $ref: '#/components/schemas/FilterCode'
          - type: 'null'
        roastLevel:
          anyOf:
          - $ref: '#/components/schemas/FilterCode'
          - type: 'null'
        acidity:
          anyOf:
          - $ref: '#/components/schemas/FilterCode'
          - type: 'null'
        processing:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: Группа processing.
        fermentation:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: Группа fermentation.
        tasteGroups:
          type: array
          items:
            $ref: '#/components/schemas/FilterCode'
          uniqueItems: true
          maxItems: 30
          description: Группа taste; исходные вкусовые дескрипторы сохраняются отдельно.
        composition:
          anyOf:
          - $ref: '#/components/schemas/FilterCode'
          - type: 'null'
      required:
      - defaultBrewPurposes
      - caffeine
      - roastLevel
      - acidity
      - processing
      - fermentation
      - tasteGroups
      - composition
      description: Нормализованные коды групп из /catalogs/coffee-filter-values. null/[] — нет подтверждённых данных.
        Помол под метод не определяет назначение обжарки. Обработка natural и ферментация anaerobic могут сочетаться.
        Неактивные значения скрыты публично, но сохранены в административной карточке.
    RoasterIdentity:
      type: object
      additionalProperties: false
      properties:
        address:
          $ref: '#/components/schemas/PublicAddress'
        name:
          type: string
        coverPhoto:
          anyOf:
          - $ref: '#/components/schemas/Photo'
          - type: 'null'
      required:
      - address
      - name
      - coverPhoto
    CoffeeShopCard:
      type: object
      additionalProperties: false
      properties:
        address:
          $ref: '#/components/schemas/PublicAddress'
        name:
          type: string
        city:
          anyOf:
          - $ref: '#/components/schemas/PublicAddress'
          - type: 'null'
        addressLine:
          type: string
        coverPhoto:
          anyOf:
          - $ref: '#/components/schemas/Photo'
          - type: 'null'
        rating:
          type: number
          minimum: 0
          maximum: 5
        checkInCount:
          type: integer
          minimum: 0
        isOpen:
          anyOf:
          - type: boolean
          - type: 'null'
        isVisited:
          anyOf:
          - type: boolean
          - type: 'null'
        isFavorite:
          anyOf:
          - type: boolean
