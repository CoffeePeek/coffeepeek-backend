  /api/v1/coffees/facets:
    post:
      operationId: getCoffeeFacets
      summary: Доступные фильтры и счётчики кофе
      description: 'Возвращаются все поддержанные группы: roasters, countries, productKind, productForm, brew, caffeine,
        roast, acidity, processing, fermentation, taste, composition, weightGrams, currency, availabilityScope.
        Для productKind/productForm/weightGrams/currency/availabilityScope selection=single, для массивов — or.
        weightGrams.options.code — десятичная строка; в filters.weightGrams передаётся целое число. Списки обжарщиков/стран
        ограничиваются опубликованным каталогом, выбранные значения сохраняются даже с нулевым count.'
      tags:
      - Discovery
      security:
      - {}
      - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ в стандартном Response<T> проекта.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  isSuccess:
                    type: boolean
                    const: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CoffeeFacetsResult'
                required:
                - isSuccess
                - message
                - data
              example:
                isSuccess: true
                message: Operation successful
                data:
                  totalItems: 1
                  groups:
                  - code: caffeine
                    name: Кофеин
                    selection: or
                    options:
                    - code: decaf
                      name: Декаф
                      count: 1
                      selected: true
                    - code: regular
                      name: Обычный
                      count: 8
                      selected: false
                  priceRange:
                    currency: BYN
                    weightGrams: 250
                    min: 32
                    max: 62
        '400':
          description: Некорректный фильтр, несовместимые параметры или неизвестный/неактивный код.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
