          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoffeeFacetsRequest'
            example:
              filters:
                roasters:
                - sample-roaster
                countries:
                - CO
                - ET
                brew:
                - filter
                caffeine:
                - decaf
                weightGrams: 250
                currency: BYN
                maxPrice: 50
                availableOnly: true
