  title: CoffeePeek — discovery and coffee API
  version: 1.0.0
  description: Контракт backend-реализации от 2026-10-06. Поиск кофеен и кофе; полный список обжарщиков GET /api/roasters
    без пагинации. Избранное, классификация кофе и теги услуг управляются существующими маршрутами.
