<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoffeePeek — import queue (spike)</title>
  <style>
    :root {
      --bg: #16120e;
      --card: #221c16;
      --ink: #f4ece3;
      --muted: #b8a898;
      --yes: #3d8b5a;
      --good: #4a7c59;
      --cafe: #6b7d4a;
      --togo: #8a7040;
      --no: #b24a3c;
      --skip: #6b5c4d;
      --link: #3d5a80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
    }
    header { padding: 20px 24px 8px; border-bottom: 1px solid #3a3128; }
    h1 { margin: 0 0 6px; font-size: 1.4rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.95rem; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 24px; }
    .chip {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      background: #2c241c;
      color: var(--muted);
    }
    .chip.active { background: #3d3429; color: var(--ink); }
    main { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; padding: 8px 24px 32px; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
    .card, .side {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
    }
    .name { font-size: 1.7rem; margin: 8px 0; }
    .meta { color: var(--muted); margin: 4px 0; }
    .desc { margin: 10px 0; line-height: 1.4; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 12px 0; color: var(--muted); font-size: 0.92rem; }
    .research { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .research a, .research button.linkish {
      display: inline-block;
      text-decoration: none;
      background: var(--link);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      border: 0;
      font: inherit;
      cursor: pointer;
    }
    .research a.ig { background: #7a3e6b; }
    .research a.gmaps { background: #3d6b4f; }
    .research a.maps { background: #8a5a2b; }
    .research a.img { background: #5a4a7a; }
    .signals { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    button {
      font: inherit;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      color: #fff;
    }
    .cat-specialty { background: var(--yes); }
    .cat-good_coffee { background: var(--good); }
    .cat-cafe { background: var(--cafe); }
    .cat-to_go { background: var(--togo); }
    .cat-reject { background: var(--no); }
    .skip { background: var(--skip); }
    .preview {
      width: 100%;
      min-height: 180px;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      background: #2a221c;
    }
    .preview-miss { color: var(--muted); font-size: 0.9rem; padding: 12px 0; }
    iframe { width: 100%; height: 280px; border: 0; border-radius: 12px; }
    .log { max-height: 160px; overflow: auto; font-size: 0.85rem; color: var(--muted); white-space: pre-wrap; }
    a { color: #e8c38a; }
    .empty { color: var(--muted); padding: 40px 0; }
    .yandex-box { margin: 12px 0; padding: 12px 14px; border-radius: 12px; background: #2a221c; }
    .yandex-box.closed { background: #3a1f1c; }
    .yandex-box.open { background: #1f2a20; }
    .yandex-box.blocked { background: #3a2f18; }
  </style>
</head>
<body>
  <header>
    <h1>Coffee shop import queue</h1>
    <p class="sub" id="intro">Check Instagram and Yandex photos. Places with no OSM edits in over 5 years are removed from the queue.</p>
  </header>
  <div class="stats" id="stats"></div>
  <main>
    <section class="card" id="card"></section>
    <aside class="side">
      <img class="preview" id="photo" alt="" hidden />
      <p class="preview-miss" id="photoMiss">Site preview loads if the place has its own page.</p>
      <div class="yandex-box" id="googleBox">Google: waiting for status…</div>
      <div class="yandex-box" id="yandexBox">Yandex: waiting for status…</div>
      <iframe id="map" title="Yandex map"></iframe>
      <p class="log" id="log"></p>
    </aside>
  </main>
  <script>
    const BUCKET_ORDER = ["likely_specialty", "priority", "review", "likely_noise", "auto_reject"];
    const LABELS = {
      likely_specialty: "looks like specialty",
      priority: "coffee signal",
      review: "plain cafe",
      likely_noise: "noise / chains / canteens",
      auto_reject: "vending machines",
    };
    const KEY = "cp-spike-001-decisions";
    const IN_FEED = ["specialty", "good_coffee", "cafe", "to_go"];
    const CATEGORIES = [
      { id: "specialty", label: "Specialty" },
      { id: "good_coffee", label: "Good coffee" },
      { id: "cafe", label: "Cafe with decent coffee" },
      { id: "to_go", label: "To-go / chain" },
      { id: "reject", label: "Not for feed" },
    ];
    const events = [];

    function log(cat, msg, extra) {
      events.push({ t: new Date().toISOString(), cat, msg, extra });
      document.getElementById("log").textContent =
        events.slice(-12).map(e => `${e.t.slice(11,19)} ${e.cat} ${e.msg}`).join("\n");
    }

    function normalizeDecision(value) {
      if (value === "yes") return "specialty";
      if (value === "no") return "reject";
      return value;
    }

    function loadDecisions() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
        const next = {};
        for (const [id, value] of Object.entries(raw)) next[id] = normalizeDecision(value);
        return next;
      } catch { return {}; }
    }
    function saveDecisions(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

    let data = null;
    let filter = "priority";
    let index = 0;
    let decisions = loadDecisions();
    let previewToken = 0;

    function queue() {
      return data.candidates.filter(c => c.bucket === filter && !decisions[c.externalId]);
    }

    function fact(label, value) {
      return value ? `<div><strong>${label}</strong> ${value}</div>` : "";
    }

    function osmAgeLabel(c) {
      if (!c.osmUpdatedAt) return "no edit date";
      const days = c.osmAgeDays;
      const date = c.osmUpdatedAt.slice(0, 10);
      if (days == null) return date;
      if (days < 60) return `${date} · ${days} days ago`;
      const years = (days / 365).toFixed(1);
      return `${date} · ${years} years ago`;
    }

    function renderStats() {
      const counts = { ...data.counts };
      const decided = Object.values(decisions);
      const catCounts = Object.fromEntries(CATEGORIES.map(c => [c.id, decided.filter(x => x === c.id).length]));
      const inFeed = decided.filter(x => IN_FEED.includes(x)).length;
      document.getElementById("stats").innerHTML =
        BUCKET_ORDER.map(b =>
          `<button class="chip ${filter===b?"active":""}" data-b="${b}">${LABELS[b]} · ${counts[b]||0}</button>`
        ).join("") + CATEGORIES.map(c =>
          `<span class="chip">${c.label} · ${catCounts[c.id]||0}</span>`
        ).join("") + `<span class="chip">in feed ${inFeed}</span>`
        + (data.droppedStale ? `<span class="chip">dropped stale &gt;${data.staleYears || 5}y · ${data.droppedStale}</span>` : "")
        + `<button class="chip" id="export">export JSON</button>`;
      document.querySelectorAll("[data-b]").forEach(btn => {
        btn.onclick = () => { filter = btn.dataset.b; index = 0; render(); };
      });
      document.getElementById("export").onclick = () => {
        const blob = new Blob([JSON.stringify({ decisions, events }, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "import-decisions.json";
        a.click();
        log("export", `inFeed=${inFeed}`);
      };
    }

    function googleSearchUrl(c) {
      const q = encodeURIComponent(`${c.name} Минск`);
      if (c.lat && c.lon) {
        return `https://www.google.com/maps/search/${q}/@${c.lat},${c.lon},17z`;
      }
      return `https://www.google.com/maps/search/?api=1&query=${q}`;
    }

    function researchButtons(c) {
      const L = c.links || {};
      const parts = [];
      parts.push(`<a class="gmaps" id="googleOpen" href="${googleSearchUrl(c)}" target="_blank" rel="noreferrer">Open in Google</a>`);
      if (L.instagram) parts.push(`<a class="ig" href="${L.instagram}" target="_blank" rel="noreferrer">Instagram</a>`);
      else if (L.instagramSearch) parts.push(`<a class="ig" href="${L.instagramSearch}" target="_blank" rel="noreferrer">Find Instagram</a>`);
      if (L.yandexMaps) parts.push(`<a class="maps" href="${L.yandexMaps}" target="_blank" rel="noreferrer">Yandex · listing photos</a>`);
      if (L.yandexImages) parts.push(`<a class="img" href="${L.yandexImages}" target="_blank" rel="noreferrer">Yandex · images</a>`);
      if (L.website && !(L.instagram && L.website.includes("instagram"))) {
        parts.push(`<a href="${L.website}" target="_blank" rel="noreferrer">Website</a>`);
      }
      if (c.facebook) parts.push(`<a href="${c.facebook}" target="_blank" rel="noreferrer">Facebook</a>`);
      if (c.vk) parts.push(`<a href="${c.vk}" target="_blank" rel="noreferrer">VK</a>`);
      if (L.osmHistory) parts.push(`<a href="${L.osmHistory}" target="_blank" rel="noreferrer">OSM history</a>`);
      else if (L.osm) parts.push(`<a href="${L.osm}" target="_blank" rel="noreferrer">OSM</a>`);
      return parts.join("");
    }

    function loadGoogle(c) {
      const box = document.getElementById("googleBox");
      box.className = "yandex-box";
      box.textContent = "Google: checking whether the place is still open…";
      const q = new URLSearchParams({ name: c.name, lat: c.lat, lon: c.lon });
      fetch("/google-status?" + q.toString())
        .then(r => r.json())
        .then(p => {
          if (!p.ok) {
            box.classList.add("blocked");
            box.textContent = "Google: " + (p.hint || p.error);
            log("google", p.error || "fail");
            return;
          }
          const b = p.best;
          const gBtn = document.getElementById("googleOpen");
          if (gBtn && b?.mapsUrl) {
            gBtn.href = b.mapsUrl;
            gBtn.textContent = "Open in Google · listing";
          }
          if (p.verdict === "closed") {
            box.classList.add("closed");
            box.textContent = `Google: permanently closed — ${b?.name || c.name}. Excluded.`;
          } else if (p.verdict === "temp_closed") {
            box.classList.add("blocked");
            box.textContent = `Google: temporarily closed — ${b?.name || c.name}`;
          } else if (p.verdict === "open") {
            box.classList.add("open");
            const maps = b?.mapsUrl ? ` · ${b.mapsUrl}` : "";
            box.innerHTML = `Google: open — <strong>${b.name}</strong> · ${b.address || ""}`;
          } else if (p.verdict === "not_found") {
            box.classList.add("blocked");
            box.textContent = "Google: nothing found nearby. Check the listing manually.";
          } else if (p.verdict === "far") {
            box.classList.add("blocked");
            box.textContent = "Google: same-name matches exist, but far from the OSM point.";
          } else {
            box.textContent = "Google: status unclear.";
          }
          log("google", p.verdict);
        })
        .catch(() => {
          box.classList.add("blocked");
          box.textContent = "Google: request failed.";
        });
    }

    function loadYandex(c) {
      const box = document.getElementById("yandexBox");
      box.className = "yandex-box";
      box.textContent = "Yandex: checking whether the place is still open…";
      const q = new URLSearchParams({ name: c.name, lat: c.lat, lon: c.lon });
      fetch("/yandex-status?" + q.toString())
        .then(r => r.json())
        .then(p => {
          if (!p.ok) {
            box.classList.add("blocked");
            box.textContent = p.hint || p.error || "Yandex Places unavailable";
            log("yandex", p.error || "fail");
            return;
          }
          const b = p.best;
          if (p.verdict === "closed") {
            box.classList.add("closed");
            box.textContent = `Yandex: closed — ${b?.name || c.name}. Excluded.`;
          } else if (p.verdict === "not_found") {
            box.classList.add("blocked");
            box.textContent = "Yandex: no organization found nearby. Check the listing manually.";
          } else if (p.verdict === "far") {
            box.classList.add("blocked");
            box.textContent = "Yandex: same-name matches exist, but far from the OSM point.";
          } else if (b) {
            box.classList.add("open");
            box.textContent = `Yandex: ${b.name} · ${b.hours || "hours not listed"} · ${b.address || ""}`;
          } else {
            box.textContent = "Yandex: empty response.";
          }
          log("yandex", p.verdict);
        })
        .catch(() => {
          box.classList.add("blocked");
          box.textContent = "Yandex: request failed.";
        });
    }

    function loadPreview(c) {
      const photo = document.getElementById("photo");
      const miss = document.getElementById("photoMiss");
      photo.hidden = true;
      photo.removeAttribute("src");
      const token = ++previewToken;
      const url = c.website && !String(c.website).includes("instagram") ? c.website : null;
      if (!url) {
        miss.textContent = c.instagram
          ? "No photo in OSM. Open Instagram to see how coffee-focused the place is."
          : "OSM almost never has photos. Open Yandex · listing photos or images.";
        return;
      }
      miss.textContent = "Loading site preview…";
      fetch("/preview?url=" + encodeURIComponent(url))
        .then(r => r.json())
        .then(p => {
          if (token !== previewToken) return;
          if (p.ok && p.image) {
            photo.src = p.image;
            photo.hidden = false;
            miss.textContent = [p.title, p.description].filter(Boolean).join(" — ");
            log("preview", p.title || "image");
          } else {
            miss.textContent = "Site returned no image. Check Instagram / Yandex.";
          }
        })
        .catch(() => {
          if (token !== previewToken) return;
          miss.textContent = "Preview failed to load. Check Instagram / Yandex.";
        });
    }

    function renderCard() {
      const q = queue();
      const card = document.getElementById("card");
      if (!q.length) {
        card.innerHTML = `<p class="empty">Bucket "${LABELS[filter]}" is done. Take the next one; no need to review all 1500.</p>`;
        document.getElementById("map").src = "";
        document.getElementById("photo").hidden = true;
        return;
      }
      if (index >= q.length) index = 0;
      const c = q[index];
      card.innerHTML = `
        <p class="chip">${LABELS[c.bucket]} · ${index+1}/${q.length}</p>
        <h2 class="name">${c.name}</h2>
        ${c.description ? `<p class="desc">${c.description}</p>` : ""}
        <div class="facts">
          ${fact("address", c.address || "not in OSM")}
          ${fact("cuisine", [c.cuisine, c.shop, c.brand].filter(Boolean).join(" · "))}
          ${fact("hours", c.openingHours)}
          ${fact("phone", c.phone)}
          ${fact("terrace", c.outdoorSeating)}
          ${fact("takeaway", c.takeaway)}
          ${fact("wifi", c.internetAccess)}
          ${fact("OSM updated", osmAgeLabel(c))}
          ${fact("check_date", c.checkDate)}
          ${fact("OSM version", c.osmVersion)}
        </div>
        <div class="research">${researchButtons(c)}</div>
        <div class="signals">${(c.signals||[]).map(s => `<span class="chip">${s}</span>`).join("")}</div>
        <div class="actions">
          ${CATEGORIES.map(cat => `<button class="cat-${cat.id}" data-cat="${cat.id}">${cat.label}</button>`).join("")}
          <button class="skip" id="skip">Later</button>
        </div>
      `;
      const lon = c.lon, lat = c.lat;
      document.getElementById("map").src = lon && lat
        ? `https://yandex.ru/map-widget/v1/?ll=${lon},${lat}&z=16&pt=${lon},${lat},pm2rdm`
        : "";
      card.querySelectorAll("[data-cat]").forEach(btn => {
        btn.onclick = () => decide(c, btn.dataset.cat);
      });
      document.getElementById("skip").onclick = () => { index++; render(); log("skip", c.name); };
      loadPreview(c);
      loadGoogle(c);
      loadYandex(c);
    }

    function decide(c, verdict) {
      decisions[c.externalId] = verdict;
      saveDecisions(decisions);
      log(verdict, c.name, { id: c.externalId, bucket: c.bucket });
      render();
    }

    function render() { renderStats(); renderCard(); }

    fetch("./candidates-ui.json")
      .then(r => r.json())
      .then(payload => {
        data = payload;
        log("load", `${payload.total} queued, stale ${payload.droppedStale || 0}`);
        const intro = document.getElementById("intro");
        if (intro && payload.droppedStale) {
          intro.textContent =
            `${payload.total} queued. Dropped ${payload.droppedStale} with no OSM edits in over ${payload.staleYears || 5} years.`;
        }
        filter = (payload.counts.priority || 0) > 0 ? "priority" : "likely_specialty";
        render();
      })
      .catch(err => {
        document.getElementById("card").innerHTML =
          `<p class="empty">Failed to load candidates-ui.json. Run <code>python3 serve.py</code>.</p>`;
        log("error", String(err));
      });
  </script>
</body>
</html>
