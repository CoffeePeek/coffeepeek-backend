name: Secret scan

on:
  # main/develop/dev call this workflow from CI/CD and gate publishing on it.
  push:
    branches-ignore: [main, develop, dev]
  pull_request:
    branches-ignore: [main, develop, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install checksum-verified Gitleaks
        run: python dev/security/scan_secrets.py install

      - name: Verify scanner blocks new credentials
        run: python -m unittest discover -s dev/security -p 'test_*.py' -v

      - name: Scan history for new secrets
        run: python dev/security/scan_secrets.py scan
