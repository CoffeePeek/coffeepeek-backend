name: CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable CI-only credentials, never used by a deployment.
          POSTGRES_PASSWORD: coffeepeek-ci-only-postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            global.json
            CoffeePeek.Backend.ci.slnf

      - name: Restore backend solution
        run: dotnet restore "CoffeePeek.Backend.ci.slnf" -p:AllowMissingPrunePackageData=true

      - name: Audit dependencies
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          report="$(dotnet list "CoffeePeek.Backend.ci.slnf" package --vulnerable --include-transitive 2>&1)"
          set -e
          echo "$report"
          {
            echo "### Vulnerable packages report"
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$report" | grep -qiE '>\s*Project|has the following vulnerable'; then
            echo "::warning::Vulnerable NuGet packages reported by dotnet list; see the step log and job summary"
          fi

      - name: Build backend solution
        run: dotnet build "CoffeePeek.Backend.ci.slnf" --configuration Release --no-restore -m -p:AllowMissingPrunePackageData=true

      - name: Run tests
        run: dotnet test "CoffeePeek.Backend.ci.slnf" --configuration Release --no-build -m -p:AllowMissingPrunePackageData=true --verbosity normal

      - name: Start isolated MinIO for legacy migration verification
        run: |
          docker run -d --name coffeepeek-legacy-test-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=coffee-legacy-test -e MINIO_ROOT_PASSWORD=coffee-legacy-test-only \
            bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Verify Shops write and discovery contracts with real PostgreSQL 17
        run: |
          set -euo pipefail
          pgpass_file="$(mktemp "${RUNNER_TEMP}/coffeepeek-pgpass.XXXXXX")"
          trap 'rm -f "$pgpass_file"' EXIT
          chmod 600 "$pgpass_file"
          printf '%s\n' '127.0.0.1:5432:*:postgres:coffeepeek-ci-only-postgres' > "$pgpass_file"
          export COFFEEPEEK_LIVE_PG='Host=127.0.0.1;Port=5432;Username=postgres;Database=postgres;SslMode=Disable'
          export COFFEEPEEK_LIVE_PG_ALLOW_SUPERUSER=1
          export PGPASSFILE="$pgpass_file"
          mkdir -p .test-results/shops-live
          assembly='CoffeePeek.Shops.Infrastructure.Tests/bin/Release/net10.0/CoffeePeek.Shops.Infrastructure.Tests.dll'
          for class in \
            DiscoveryClassificationLiveTests \
            DiscoveryQueryLiveTests \
            ShopProfileWolverineLiveTests \
            ShopProfileRevisionLiveTests \
            ShopVisibilityWolverineLiveTests \
            ShopProfileOutboxLiveTests \
            DrinkCatalogWriteProtocolLiveTests \
            AppDownloadRedirectDurabilityLiveTests \
            ShopMenuManualWriteLiveTests \
            MenuOcrJobLiveTests \
            ShopEquipmentLiveTests \
            ShopChangeRequestMenuLiveTests \
            ShopChangeRequestOutboxLiveTests \
            CheckInModerationRaceLiveTests \
            CheckInHelpfulOutboxLiveTests \
            ReviewReportCommitLiveTests \
            CoffeeZonePolygonLiveTests \
            CoffeeZoneWriteProtocolLiveTests \
            ShopsDirectWriteBoundaryLiveTests \
            CoffeeChildConcurrencyLiveTests \
            CityReferenceLiveTests \
            CityCatalogFreshReadLiveTests; do
            result=".test-results/shops-live/${class}.trx"
            dotnet "$assembly" \
              -class "CoffeePeek.Shops.Infrastructure.Tests.LivePostgres.${class}" \
              -failSkips -noAutoReporters -trx "$result"
            python3 - "$result" "$class" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path, class_name = sys.argv[1:]
          root = ET.parse(path).getroot()
          counters = next((node for node in root.iter() if node.tag.endswith('Counters')), None)
          if counters is None:
              raise SystemExit(f'{class_name}: TRX counters missing')
          total = int(counters.attrib.get('total', 0))
          passed = int(counters.attrib.get('passed', 0))
          executed = int(counters.attrib.get('executed', 0))
          skipped = int(counters.attrib.get('notExecuted', 0))
          if total == 0 or passed != total or executed != total or skipped:
              raise SystemExit(f'{class_name}: required live tests did not all pass: '
                               f'total={total}, executed={executed}, passed={passed}, skipped={skipped}')
          print(f'{class_name}: {passed} required live tests passed')
          PY
          done

      - name: Upload Shops PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shops-live-postgres-trx
          path: .test-results/shops-live/*.trx
          if-no-files-found: ignore

      - name: Rehearse legacy transfer and cleanup with PostgreSQL and MinIO
        run: |
          set -euo pipefail
          pgpass_file="$(mktemp "${RUNNER_TEMP}/coffeepeek-legacy-pgpass.XXXXXX")"
          trap 'rm -f "$pgpass_file"; docker rm -f coffeepeek-legacy-test-minio' EXIT
          chmod 600 "$pgpass_file"
          printf '%s\n' '127.0.0.1:5432:*:postgres:coffeepeek-ci-only-postgres' > "$pgpass_file"
          COFFEEPEEK_LIVE_PG='Host=127.0.0.1;Port=5432;Username=postgres;Database=postgres;SslMode=Disable' \
          COFFEEPEEK_LIVE_PG_ALLOW_SUPERUSER=1 \
          COFFEEPEEK_LIVE_MINIO=http://127.0.0.1:9000 \
          PGPASSFILE="$pgpass_file" \
            dotnet test CoffeePeek.LegacyCheckInMigration.Tests --configuration Release --no-build \
              --filter 'Category=LivePostgres' --verbosity normal

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dev/coffee-import/requirements.txt

      - name: Test coffee collectors and deployment validation
        run: |
          python -m pip install -r dev/coffee-import/requirements.txt
          python -X utf8 -m unittest discover -s dev/coffee-import -p 'test_*.py' -v
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          python dev/coffee-import/validate_deployment.py --mapping deploy/coffee-import/disabled-mapping.json --allow-disabled

  build_and_push_images:
    needs: build_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: accountservice
            dockerfile: CoffeePeek.AccountService/AccountService.Dockerfile
            image: coffeepeek.accountservice
          - service: shopsservice
            dockerfile: CoffeePeek.ShopsService/ShopsService.Dockerfile
            image: coffeepeek.shopsservice
          - service: moderationservice
            dockerfile: CoffeePeek.ModerationService/ModerationService.Dockerfile
            image: coffeepeek.moderationservice
          - service: mediaservice
            dockerfile: CoffeePeek.MediaService/MediaService.Dockerfile
            image: coffeepeek.mediaservice
          - service: gateway
            dockerfile: CoffeePeek.Gateway/Gateway.Dockerfile
            image: gateway

    env:
      REGISTRY: docker.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:dev
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy_vps:
    needs: build_and_push_images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_OPTS: "-o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o ConnectTimeout=30"
        run: |
          rsync -az --delete \
            -e "ssh ${SSH_OPTS}" \
            --exclude '.git' \
            --exclude '**/bin' \
            --exclude '**/obj' \
            --exclude '**/.venv' \
            --exclude 'deploy/.env' \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/coffeepeek/"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          SSH_OPTS: "-o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o ConnectTimeout=30"
        run: |
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" \
            "export DOCKER_HUB_USERNAME='${DOCKER_HUB_USERNAME}'; \
             export DOCKER_HUB_PASSWORD='${DOCKER_HUB_PASSWORD}'; \
             set -euo pipefail; \
             cd /opt/coffeepeek/deploy && chmod +x scripts/*.sh && bash scripts/ci-deploy.sh"
