title = "CoffeePeek secret scanning"

[extend]
useDefault = true

# Provider rules apply to every file, including tests and env examples.
[[rules]]
id = "coffeepeek-google-oauth-secret"
description = "Google OAuth client secret"
regex = '''\b(GOCSPX-[A-Za-z0-9_-]{20,})\b'''
secretGroup = 1
keywords = ["gocspx-"]

[[rules]]
id = "coffeepeek-resend-token"
description = "Resend API token"
regex = '''\b(re_[A-Za-z0-9_]{24,})\b'''
secretGroup = 1
keywords = ["re_"]

[[rules]]
id = "coffeepeek-yandex-geocoder-key"
description = "UUID-shaped geocoder API key assignment"
regex = '''(?i)(api[_-]?key|yandex[a-z0-9_]*key)["']?\s*[:=]\s*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 2
keywords = ["apikey", "api_key", "yandex"]
