# Local development infrastructure for CoffeePeek.
# Starts ONLY the backing services (Postgres, RabbitMQ, Redis, MinIO) that the
# .NET services expect. The services themselves are run on the host by
# dev/run-services.sh, which builds and launches DLLs with development config.
#
# Usage:
#   docker compose -f dev/docker-compose.dev.yml up -d
#
# Credentials here are LOCAL DEV ONLY and are referenced by dev/dev.env.

name: coffeepeek-dev-infra

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffeepeek
      POSTGRES_PASSWORD: coffeepeek
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeepeek -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    networks: [default, checkin-render]
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: coffeepeek-minio-mc:2025-08-13
    pull_policy: build
    build:
      context: ../deploy/minio
      dockerfile: mc.Dockerfile
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "/provision/provision.sh"]
    volumes:
      - ../deploy/minio:/provision:ro
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CHECKIN_READ_USER: coffeepeek-checkin-reader
      MINIO_CHECKIN_READ_PASSWORD: local-checkin-reader-password
      MINIO_CHECKIN_VARIANT_USER: coffeepeek-checkin-variant-writer
      MINIO_CHECKIN_VARIANT_PASSWORD: local-checkin-variant-password
      MINIO_CHECKIN_VARIANT_READ_USER: coffeepeek-checkin-variant-reader
      MINIO_CHECKIN_VARIANT_READ_PASSWORD: local-checkin-variant-reader-password

  checkin-renderer:
    image: ghcr.io/imgproxy/imgproxy:v4.0.18
    restart: unless-stopped
    networks: [checkin-render]
    env_file: ../deploy/imgproxy/checkin-renderer.conf
    # Host-run Media reaches this loopback port; production publishes no renderer port.
    ports: ["127.0.0.1:18080:8080"]
    environment:
      AWS_ACCESS_KEY_ID: coffeepeek-checkin-reader
      AWS_SECRET_ACCESS_KEY: local-checkin-reader-password
      IMGPROXY_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      IMGPROXY_SALT: '2222222222222222222222222222222222222222222222222222222222222222'
    mem_limit: 512m
    cpus: 1.0

networks:
  checkin-render:
    internal: true

volumes:
  pg_data:
  minio_data:
